<!DOCTYPE1 html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang web của tôi</title>
  <!-- Liên kết tệp CSS chính xác -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Thẻ neo Chuyển đến Nội dung chính (Skip to Main Content) -->
  <a href="#main" class="skip-link">Chuyển đến Nội dung chính</a>

  <nav>
    <img src="logo.png" alt="Logo">
    <!-- Các liên kết điều hướng khác -->
  </nav>

  <!-- Thẻ main với ID phục vụ cho liên kết skip -->
  <main id="main">
    
    <!-- Phần sử dụng Grid -->
    <section class="grid">
      <div><img src="park1.jpg" alt="Công viên 1"></div>
      <div><img src="park2.jpg" alt="Công viên 2"></div>
    </section>

    <!-- Phần sử dụng Flexbox -->
    <section class="flex">
      <div><img src="flex1.jpg" alt="Hình ảnh flex 1"></div>
      <div><img src="flex2.jpg" alt="Hình ảnh flex 2"></div>
    </section>

  </main>

</body>
</html>
